name: Build WHYRED kernel (4.19) - workflow_dispatch

on:
  workflow_dispatch:
    inputs:
      build_perf:
        description: 'Build tools/perf on runner (only on x86_64). true/false'
        required: false
        default: 'false'
      push_changes:
        description: 'If "true", commit & push applied patches/backports to repo'
        required: false
        default: 'false'
      use_prebuilts_toolchain:
        description: 'If "true", download Android prebuilts toolchain (aarch64 clang/gcc).'
        required: false
        default: 'false'
      cross_prefix:
        description: 'Cross compile prefix (e.g. aarch64-linux-gnu-)'
        required: false
        default: 'aarch64-linux-gnu-'
      kernel_defconfig:
        description: 'Which defconfig to use (e.g. whyred_defconfig)'
        required: false
        default: 'whyred_defconfig'
      make_jobs:
        description: 'Number of parallel make jobs (-j). Use nproc or a number.'
        required: false
        default: '$(nproc)'

concurrency:
  group: build-whyred-${{ github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    env:
      ARCH: arm64
      ODIR: out
      CROSS_COMPILE: ${{ github.event.inputs.cross_prefix }}
      DEFCONFIG: ${{ github.event.inputs.kernel_defconfig }}
      MAKE_J: ${{ github.event.inputs.make_jobs }}
    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: true

      - name: Fix safe.directory for GitHub Actions runners
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install host dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential bc bison flex libelf-dev libaudit-dev libnuma-dev \
            libdw-dev libunwind-dev python3 python3-dev pkg-config libssl-dev libncurses5-dev \
            gcc-aarch64-linux-gnu device-tree-compiler rsync

      - name: Apply patches from patches/ (git apply)
        run: |
          if [ -d patches ] && [ "$(ls -A patches)" ]; then
            for p in patches/*.patch; do
              [ -e "$p" ] || continue
              git apply --index "$p" || { echo "git apply failed on $p"; exit 1; }
            done
            git add -A
            git commit -m "Applied patches from CI ($(date --iso-8601=seconds))" || echo "No changes to commit"
          else
            echo "No patches found"
          fi

      - name: Optionally push patches/commits back to repo
        if: ${{ github.event.inputs.push_changes == 'true' }}
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git push origin HEAD

      - name: Prepare build dir & defconfig
        run: |
          mkdir -p $ODIR
          make O=$ODIR $DEFCONFIG ARCH=$ARCH CROSS_COMPILE=$CROSS_COMPILE

      - name: Build kernel (core)
        run: |
          set -e
          make -j${{ env.MAKE_J }} O=$ODIR ARCH=$ARCH CROSS_COMPILE=$CROSS_COMPILE \
               KBUILD_BUILD_USER=ci KBUILD_BUILD_VERSION=1

      - name: Build modules & dtbs
        run: |
          make -j${{ env.MAKE_J }} O=$ODIR ARCH=$ARCH CROSS_COMPILE=$CROSS_COMPILE modules dtbs || true

      - name: Optional: Build perf (host)
        if: ${{ github.event.inputs.build_perf == 'true' }}
        run: |
          cd tools/perf || { echo "tools/perf missing"; exit 0; }
          PYTHON=python3 make -j${{ env.MAKE_J }}
          mkdir -p $GITHUB_WORKSPACE/artifacts
          cp ./perf $GITHUB_WORKSPACE/artifacts/ || true

      - name: Collect build artifacts
        run: |
          ART_DIR=$GITHUB_WORKSPACE/artifacts
          mkdir -p $ART_DIR
          cp -a $ODIR/.config $ART_DIR/.config || true
          if [ -d $ODIR/arch/arm64/boot/dts ]; then cp -r $ODIR/arch/arm64/boot/dts $ART_DIR/; fi
          cp -a $(find $ODIR -type f -name 'Image*' -print 2>/dev/null | head -n1) $ART_DIR/ 2>/dev/null || true
          if [ -d $ODIR/lib/modules ]; then tar -C $ODIR -czf $ART_DIR/modules.tar.gz lib/modules || true; fi
          ls -la $ART_DIR || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: whyred-kernel-artifacts
          path: artifacts/
